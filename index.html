<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休暇届 | 株式会社ケイラボ</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<style>
:root{
  --bg:#f5f4f2; --card:#ffffff; --ink:#1a1a1a; --sub:#8a8680;
  --line:#e8e6e2; --accent:#111111; --red:#c0392b;
  --holiday:#2b6cb0; --holiday-bg:#edf4fb;
  --ok:#2f855a; --ok-bg:#ecf6f0; --calc:#f2f0ec;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.brand{font-size:11px;letter-spacing:.18em;color:var(--sub)}
h1{font-size:22px;font-weight:700;margin:2px 0 4px}
.sync{font-size:11px;color:var(--sub);margin-bottom:16px}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px}
.topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{border-color:#c9c5bf}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.danger{color:var(--red);border-color:#eddede;background:#fdf7f7;font-size:12px;padding:5px 10px}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px}
.post-card{cursor:pointer;transition:border-color .15s}
.post-card:hover{border-color:#c9c5bf}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-bottom:6px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;color:var(--holiday);background:var(--holiday-bg)}
.badge.st-pending{color:#b7791f;background:#fdf6e9}
.badge.st-approved{color:var(--ok);background:var(--ok-bg)}
.badge.st-rejected{color:var(--red);background:#fdf0ee}
.approvebox{background:#fdf6e9;border:1px solid #f0e3c8;border-radius:10px;padding:14px;margin-top:12px}
.approvebox p{font-size:12.5px;color:#8a6d1f;margin-bottom:8px}
.approverow{display:flex;gap:8px;flex-wrap:wrap}
.approverow select{flex:1;min-width:200px}
details.howto{background:#f2f0ec;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0 4px;font-size:13px}
details.howto summary{cursor:pointer;font-weight:600;color:#6b6660;font-size:12.5px}
details.howto ol{margin:8px 0 4px 20px}
details.howto li{margin-bottom:4px}
details.howto .mailex{background:#fff;border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12.5px;color:#555;white-space:pre-wrap}
.ynbox{background:#fdf6e9;border:1px solid #f0e3c8;border-radius:10px;padding:12px 14px;margin-top:4px;font-size:14px}
.ynbox .q{margin-bottom:8px;line-height:1.6}
.ynbox .opts{display:flex;gap:18px}
.ynbox label.opt{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;margin:0;cursor:pointer}
.ynbox input{width:17px;height:17px;accent-color:var(--accent)}
.post-title{font-size:15.5px;font-weight:700;margin-bottom:2px}
.post-sub{font-size:12.5px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:48px 0}
label{display:block;font-size:12.5px;font-weight:600;margin:14px 0 4px}
label .req{color:var(--red);font-size:11px;margin-left:4px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff}
input:focus,textarea:focus{outline:2px solid #d5d2cc;outline-offset:-1px}
input[readonly]{background:var(--calc);color:var(--sub)}
textarea{resize:vertical;min-height:90px}
.daterow{display:flex;gap:8px;align-items:center}
.daterow input{flex:1}
.calcbox{background:var(--holiday-bg);border:1px solid #d3e2f2;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13.5px}
.calcbox b{font-size:16px}
.section-title{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--sub);margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.checkrow{display:flex;align-items:center;gap:9px;background:var(--ok-bg);border:1px solid #d5e8dd;border-radius:10px;padding:12px 14px;margin-top:4px;cursor:pointer;font-size:14px}
.checkrow input{width:18px;height:18px;accent-color:var(--ok)}
.detail-row{display:flex;gap:12px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.detail-label{min-width:150px;font-size:12.5px;color:var(--sub);padding-top:2px}
.detail-val{flex:1;white-space:pre-wrap}
.msg{font-size:12.5px;margin-top:8px}
.msg.err{color:var(--red)}
.back{background:none;border:none;color:var(--sub);font-size:13px;padding:0;margin-bottom:14px;cursor:pointer}
.setup{max-width:560px;margin:60px auto;text-align:center}
.setup .card{padding:32px 24px}
.binid{font-family:ui-monospace,Menlo,monospace;font-size:15px;background:#f2f0ec;border-radius:8px;padding:12px;margin:14px 0;word-break:break-all;user-select:all}
.loading{text-align:center;color:var(--sub);padding:60px 0;font-size:13.5px}
.search{margin-bottom:12px}
@media(max-width:480px){.wrap{padding:16px 12px 60px}h1{font-size:19px}.detail-label{min-width:118px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">読み込み中...</div></div>

<script>
"use strict";
/* ===== 設定 ===== */
const BIN_ID = "PASTE_BIN_ID_HERE";
const JSONBIN_KEY = "$2a$10$vZ7VMUUZqAKtlQ9fqrBcmOIICIFZSZqb29oK445wVRcbZ9m/FNqKW";
const ADMIN_PASSWORD = "6332";
const API = "https://api.jsonbin.io/v3";

/* ===== 状態 ===== */
let requests = [];
let view = "list";
let currentId = null;
let lastSync = null;
let keyword = "";

/* ===== ユーティリティ ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayJP = () => new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Tokyo" });
const fmtD = s => {
  if (!s) return "";
  const [y,m,d] = s.split("-");
  return y + "年" + Number(m) + "月" + Number(d) + "日";
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const APPROVERS = ["yumi@korea-labo.com", "info@korea-labo.com"];
const EMAILJS_SID = "service_64db3nr", EMAILJS_TID = "template_pxbiqdi", EMAILJS_KEY = "Fq3I6k806Lj82-huC";
async function sendMail(toEmails, subject, body) {
  if (typeof emailjs === "undefined" || !toEmails.length) return false;
  try {
    emailjs.init(EMAILJS_KEY);
    await emailjs.send(EMAILJS_SID, EMAILJS_TID, {
      subject: subject, message: body,
      cc_emails: toEmails.join(","), name: "休暇届システム", email: toEmails.join(","),
      time: new Date().toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" })
    });
    return true;
  } catch (e) { console.error("EmailJS error:", e); return false; }
}
const stLabel = s => s === "approved" ? "✅ 承認済み" : s === "rejected" ? "差戻し" : "承認待ち";
const stClass = s => s === "approved" ? "st-approved" : s === "rejected" ? "st-rejected" : "st-pending";
const calcDays = (from, to) => {
  if (!from || !to) return null;
  const diff = (new Date(to) - new Date(from)) / 86400000;
  if (isNaN(diff) || diff < 0) return null;
  return diff + 1;
};

/* ===== データ通信 ===== */
async function loadData() {
  const res = await fetch(API + "/b/" + BIN_ID + "/latest", { headers: { "X-Master-Key": JSONBIN_KEY } });
  if (!res.ok) throw new Error("読み込みに失敗しました (" + res.status + ")");
  const json = await res.json();
  requests = (json.record && Array.isArray(json.record.requests)) ? json.record.requests : [];
  lastSync = new Date().toLocaleTimeString("ja-JP", { timeZone: "Asia/Tokyo" });
}
async function saveData() {
  const res = await fetch(API + "/b/" + BIN_ID, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY },
    body: JSON.stringify({ requests })
  });
  if (!res.ok) throw new Error("保存に失敗しました (" + res.status + ")");
  lastSync = new Date().toLocaleTimeString("ja-JP", { timeZone: "Asia/Tokyo" });
}
async function mutate(fn) {
  await loadData();
  fn();
  await saveData();
}

/* ===== 初期設定画面 ===== */
function renderSetup() {
  $("app").innerHTML =
    '<div class="setup">' +
    '<div class="brand">株式会社ケイラボ</div>' +
    '<h1>⚙️ 初期設定が必要です</h1>' +
    '<div class="card" style="margin-top:18px">' +
    '<p style="font-size:13.5px;margin-bottom:14px">下のボタンを押すと共有ストレージが作成され、IDが表示されます。<br>表示されたIDをコピーして、Claudeとのチャットに貼り付けてください。</p>' +
    '<button class="primary" id="btnCreate">🚀 共有ストレージを作成する</button>' +
    '<div id="setupResult"></div>' +
    '</div></div>';
  $("btnCreate").onclick = async () => {
    $("btnCreate").disabled = true;
    $("btnCreate").textContent = "作成中...";
    try {
      const res = await fetch(API + "/b", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Master-Key": JSONBIN_KEY, "X-Bin-Name": "keilabo-kyuka", "X-Bin-Private": "true" },
        body: JSON.stringify({ requests: [] })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      const id = json.metadata && json.metadata.id;
      $("setupResult").innerHTML =
        '<p style="font-size:13px;margin-top:16px">✅ 作成できました。このIDをコピーしてClaudeに送ってください：</p>' +
        '<div class="binid">' + esc(id) + '</div>' +
        '<button id="btnCopy">📋 IDをコピー</button>';
      $("btnCopy").onclick = () => {
        navigator.clipboard.writeText(id).then(() => { $("btnCopy").textContent = "✅ コピーしました"; });
      };
    } catch (e) {
      $("setupResult").innerHTML = '<p class="msg err">作成に失敗しました：' + esc(e.message) + '</p>';
      $("btnCreate").disabled = false;
      $("btnCreate").textContent = "🚀 共有ストレージを作成する";
    }
  };
}

/* ===== 一覧画面 ===== */
function renderList() {
  const kw = keyword.trim().toLowerCase();
  let list = requests.slice().sort((a,b) => (b.submittedAt||"").localeCompare(a.submittedAt||""));
  if (kw) list = list.filter(r => [r.name, r.reason, r.deputy, r.phonePerson, r.vacationType, r.daikyuDetail].filter(Boolean).join(" ").toLowerCase().includes(kw));
  let cards = "";
  for (const r of list) {
    cards +=
      '<div class="card post-card" data-id="' + esc(r.id) + '">' +
      '<div class="meta"><span class="badge ' + stClass(r.status) + '">' + stLabel(r.status) + '</span><span class="badge">' + esc(r.vacationType || "休暇") + '</span><span>届出日：' + esc(r.draftDate) + '</span></div>' +
      '<div class="post-title">' + esc(r.name) + '（' + esc(String(r.useDays)) + '日間）</div>' +
      '<div class="post-sub">' + fmtD(r.fromDate) + ' 〜 ' + fmtD(r.toDate) + '　｜　残日数：' + esc(String(r.afterDays)) + '日</div>' +
      '</div>';
  }
  if (!cards) cards = '<div class="empty">' + (kw ? "該当する届出がありません。" : "休暇届がありません。「＋ 新規届出」から作成してください。") + '</div>';
  $("app").innerHTML =
    '<div class="brand">株式会社ケイラボ</div>' +
    '<div class="topbar"><div><h1>休暇届</h1>' +
    '<div class="sync"><span class="dot"></span>最終同期: ' + (lastSync || "―") + '</div></div>' +
    '<div class="btnrow"><button id="btnReload">🔄 更新</button><button class="primary" id="btnNew">＋ 新規届出</button></div></div>' +
    '<div class="search"><input type="text" id="searchBox" placeholder="🔍 名前・事由などで検索..." value="' + esc(keyword) + '"></div>' +
    cards;
  $("btnReload").onclick = refresh;
  $("btnNew").onclick = () => { view = "form"; render(); };
  $("searchBox").oninput = e => { keyword = e.target.value; renderList(); const b = $("searchBox"); b.focus(); b.setSelectionRange(b.value.length, b.value.length); };
  document.querySelectorAll(".post-card").forEach(el => {
    el.onclick = () => { currentId = el.getAttribute("data-id"); view = "detail"; render(); };
  });
}

/* ===== 詳細画面 ===== */
function renderDetail() {
  const r = requests.find(x => x.id === currentId);
  if (!r) { view = "list"; render(); return; }
  const row = (label, val) => val ? '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-val">' + esc(val) + '</span></div>' : "";
  $("app").innerHTML =
    '<button class="back" id="btnBack">← 一覧に戻る</button>' +
    '<div class="card" style="padding:22px 20px">' +
    '<div class="meta"><span class="badge">休暇届</span></div>' +
    '<div class="post-title" style="font-size:18px;margin-bottom:10px">' + esc(r.name) + ' の休暇届</div>' +

    '<div class="section-title">１．基本情報</div>' +
    row("届出日", r.draftDate) +
    row("休暇者", r.name + (r.applicantEmail ? "（" + r.applicantEmail + "）" : "")) +
    row("休暇希望日", fmtD(r.fromDate) + " 〜 " + fmtD(r.toDate) + "（" + r.useDays + "日間）") +

    '<div class="section-title">２．休暇日数</div>' +
    row("現在の保有休暇日数", r.haveDays + "日") +
    row("使用日数", r.useDays + "日") +
    row("使用後の保有休暇日数", r.afterDays + "日") +

    '<div class="section-title">３．休暇の種類・事由</div>' +
    row("休暇の種類", r.vacationType) +
    row("代休の対象", r.daikyuDetail) +
    '<div style="white-space:pre-wrap;font-size:14.5px;padding:4px 2px">' + esc(r.reason) + '</div>' +

    '<div class="section-title">４．業務対応</div>' +
    row("既存業務の対応", r.workOk ? "✅ 問題なし（確認済み）" : "―") +
    row("Googleカレンダー記載", r.calOk ? "✅ 記載します（確認済み）" : "―") +
    row("業務連絡ルームでの共有", r.kakaoOk ? "✅ 前日退勤までに共有します（確認済み）" : "―") +
    row("お客様への事前共有", r.custOk ? "✅ メール・LINE・カカオトークで共有します（確認済み）" : "―") +
    row("メール不在時自動返信", r.mailOk ? "✅ 休暇期間で設定します（確認済み）" : "―") +
    row("特別業務への備え（バイヤー対応・イベント準備・新規事業など）", r.specialPrep === "YES" ? "✅ YES（備えました／該当業務なし）" : r.specialPrep === "NO" ? "⚠️ NO" : "") +
    row("休暇期間中の業務代行者", r.deputy) +
    row("会社携帯の電話対応者", r.phonePerson) +

    '<div class="section-title">５．承認</div>' +
    '<div class="detail-row"><span class="detail-label">承認状況</span><span class="detail-val"><span class="badge ' + stClass(r.status) + '">' + stLabel(r.status) + '</span></span></div>' +
    (r.status === "approved" || r.status === "rejected"
      ? row("処理者", r.approvedBy) + row("処理日時", r.approvedAt ? new Date(r.approvedAt).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" }) : "") + row("コメント", r.approveComment)
      : '<div class="approvebox"><p>最終承認（管理者のみ・パスワードが必要です）</p>' +
        '<div class="approverow"><select id="apvEmail">' + APPROVERS.map(a => '<option value="' + a + '">' + a + '</option>').join("") + '</select>' +
        '<button class="primary" id="btnApprove">✅ 承認する</button>' +
        '<button id="btnReject">↩ 差戻す</button></div>' +
        '<div id="apvMsg"></div></div>') +
    '<div style="margin-top:26px;text-align:right"><button class="danger" id="btnDelPost">🗑 この届出を削除（管理者）</button></div>' +
    '</div>';
  $("btnBack").onclick = () => { view = "list"; refresh(); };
  const decide = async (status) => {
    const pw = prompt("管理者パスワードを入力してください");
    if (pw === null) return;
    if (pw !== ADMIN_PASSWORD) { alert("パスワードが違います"); return; }
    const comment = prompt(status === "approved" ? "承認コメント（任意・空欄可）" : "差戻しの理由を入力してください") || "";
    if (status === "rejected" && !comment.trim()) { alert("差戻しの理由を入力してください"); return; }
    try {
      await mutate(() => {
        const t = requests.find(x => x.id === currentId);
        if (!t) throw new Error("届出が見つかりません");
        t.status = status;
        t.approvedBy = $("apvEmail") ? $("apvEmail").value : APPROVERS[0];
        t.approvedAt = new Date().toISOString();
        t.approveComment = comment.trim();
      });
      const t2 = requests.find(x => x.id === currentId);
      if (t2 && t2.applicantEmail) {
        const label = status === "approved" ? "承認されました" : "差戻しされました";
        await sendMail([t2.applicantEmail],
          "【休暇届】" + label + "（" + fmtD(t2.fromDate) + "〜" + fmtD(t2.toDate) + "）",
          t2.name + " さん\n\nあなたの休暇届（" + fmtD(t2.fromDate) + " 〜 " + fmtD(t2.toDate) + "・" + t2.useDays + "日間）が" + label + "。\n" +
          "処理者：" + (t2.approvedBy || "") + "\n" +
          (comment.trim() ? "コメント：" + comment.trim() + "\n" : "") +
          "\n詳細はこちら：https://korealabo.github.io/kyuka/");
      }
      render();
    } catch (e) { alert(e.message); }
  };
  if ($("btnApprove")) $("btnApprove").onclick = () => decide("approved");
  if ($("btnReject")) $("btnReject").onclick = () => decide("rejected");
  $("btnDelPost").onclick = async () => {
    const pw = prompt("管理者パスワードを入力してください");
    if (pw === null) return;
    if (pw !== ADMIN_PASSWORD) { alert("パスワードが違います"); return; }
    if (!confirm("この休暇届を削除しますか？（元に戻せません）")) return;
    await mutate(() => { requests = requests.filter(x => x.id !== currentId); });
    view = "list"; render();
  };
}

/* ===== 新規届出画面 ===== */
function renderForm() {
  $("app").innerHTML =
    '<button class="back" id="btnBack">← 一覧に戻る</button>' +
    '<div class="card" style="padding:22px 20px">' +
    '<h1 style="font-size:18px;margin-bottom:4px">休暇届の作成</h1>' +

    '<div class="section-title">１．基本情報</div>' +
    '<label>届出日</label>' +
    '<input type="text" id="fDraft" value="' + todayJP() + '" readonly>' +
    '<label>休暇者（お名前）<span class="req">必須</span></label>' +
    '<input type="text" id="fName" placeholder="あなたの名前">' +
    '<label>休暇者メール</label>' +
    '<input type="text" id="fEmail" placeholder="承認・差戻しの結果通知を受け取るメールアドレス（任意）">' +
    '<label>休暇希望日<span class="req">必須</span></label>' +
    '<div class="daterow"><input type="date" id="fFrom">〜<input type="date" id="fTo"></div>' +
    '<div class="calcbox" id="calcPeriod">日付を選ぶと休暇日数が自動計算されます</div>' +

    '<div class="section-title">２．休暇日数</div>' +
    '<label>現在の保有休暇日数<span class="req">必須</span></label>' +
    '<input type="number" id="fHave" min="0" step="0.5" placeholder="例：10">' +
    '<label>使用日数（自動計算・修正可）</label>' +
    '<input type="number" id="fUse" min="0.5" step="0.5" placeholder="休暇希望日から自動入力">' +
    '<label>使用後の保有休暇日数（自動計算）</label>' +
    '<input type="text" id="fAfter" readonly placeholder="自動計算されます">' +

    '<div class="section-title">３．休暇の種類・事由</div>' +
    '<label>休暇の種類<span class="req">必須</span></label>' +
    '<select id="fType"><option value="">選択してください</option><option value="有給休暇">有給休暇</option><option value="無給休暇">無給休暇</option><option value="代休">代休（振替休暇）</option></select>' +
    '<div id="daikyuBox" style="display:none">' +
    '<label>代休の対象<span class="req">必須</span></label>' +
    '<textarea id="fDaikyu" placeholder="いつ（何月何日）の、どの行事・どの業務に対する代休かを記入&#10;例：11月15日（土）PALTAC BtoB展示会出勤の代休" style="min-height:70px"></textarea>' +
    '</div>' +
    '<label>休暇の事由<span class="req">必須</span></label>' +
    '<textarea id="fReason" placeholder="例：私用のため、帰省のため など"></textarea>' +

    '<div class="section-title">４．業務対応</div>' +
    '<label>既存業務の対応</label>' +
    '<label class="checkrow"><input type="checkbox" id="fWorkOk"><span>既存業務の対応に問題はありません（事前処理・引き継ぎ済み）</span></label>' +
    '<label class="checkrow"><input type="checkbox" id="fWorkCal"><span>Googleカレンダーに休暇期間を記載します</span></label>' +
    '<label class="checkrow"><input type="checkbox" id="fWorkKakao"><span>休暇前日の退勤までに、会社の業務連絡カカオトークルームで休暇を共有します</span></label>' +
    '<label class="checkrow"><input type="checkbox" id="fWorkCust"><span>関連するお客様へメール・LINE・カカオトークで事前に共有します</span></label>' +
    '<label class="checkrow"><input type="checkbox" id="fWorkMail"><span>メールの不在時自動返信（不在通知）を休暇期間で設定します</span></label>' +
    '<details class="howto"><summary>📧 メール自動返信（不在通知）の設定方法はこちら</summary>' +
    '<ol>' +
    '<li>PCでGmailを開き、右上の⚙️（設定）→「すべての設定を表示」をクリック</li>' +
    '<li>「全般」タブの一番下にある「不在通知」までスクロール</li>' +
    '<li>「不在通知 ON」を選択し、開始日に休暇初日、終了日に休暇最終日を設定</li>' +
    '<li>件名と本文を入力して「変更を保存」をクリック</li>' +
    '</ol>' +
    '<div class="mailex">【件名の例】不在のお知らせ（○月○日〜○月○日）&#10;【本文の例】&#10;いつもお世話になっております。株式会社ケイラボの○○です。&#10;誠に勝手ながら、○月○日（○）〜○月○日（○）まで休暇をいただいております。&#10;この期間中はご返信が遅れる場合がございます。&#10;お急ぎの場合は弊社（info@korea-labo.com）までご連絡ください。&#10;休暇明けに順次ご返信いたします。何卒よろしくお願いいたします。</div>' +
    '</details>' +
    '<label>特別業務への備え<span class="req">必須</span></label>' +
    '<div class="ynbox"><div class="q">休暇期間中にバイヤー対応・イベント準備・新規事業の進行などがある場合、他の担当者が問題なく対応できるよう備えましたか。</div>' +
    '<div class="opts">' +
    '<label class="opt"><input type="radio" name="fPrep" value="YES"> YES（備えました／該当業務なし）</label>' +
    '<label class="opt"><input type="radio" name="fPrep" value="NO"> NO</label>' +
    '</div></div>' +
    '<label>休暇期間中の業務代行者<span class="req">必須</span></label>' +
    '<input type="text" id="fDeputy" placeholder="代行をお願いするメンバーの名前">' +
    '<label>会社携帯の電話対応者<span class="req">必須</span></label>' +
    '<input type="text" id="fPhone" placeholder="会社携帯にかかってきた電話に対応する人の名前">' +

    '<div style="text-align:right;margin-top:18px"><button class="primary" id="btnSubmit">休暇届を提出する</button></div>' +
    '<div id="fMsg"></div></div>';

  $("btnBack").onclick = () => { view = "list"; render(); };

  const updateCalc = (fromDateChange) => {
    const d = calcDays($("fFrom").value, $("fTo").value);
    if (fromDateChange) {
      if (d !== null) {
        $("fUse").value = d;
        $("calcPeriod").innerHTML = "🗓 " + fmtD($("fFrom").value) + " 〜 " + fmtD($("fTo").value) + "　→　休暇日数：<b>" + d + "日間</b>";
      } else {
        $("calcPeriod").textContent = ($("fFrom").value && $("fTo").value) ? "⚠️ 終了日は開始日以降の日付を選んでください" : "日付を選ぶと休暇日数が自動計算されます";
      }
    }
    const have = parseFloat($("fHave").value), use = parseFloat($("fUse").value);
    if (!isNaN(have) && !isNaN(use)) {
      const after = Math.round((have - use) * 10) / 10;
      $("fAfter").value = after + "日" + (after < 0 ? "　⚠️ 保有日数を超えています" : "");
    } else {
      $("fAfter").value = "";
    }
  };
  $("fType").onchange = () => { $("daikyuBox").style.display = $("fType").value === "代休" ? "block" : "none"; };
  $("fFrom").onchange = () => updateCalc(true);
  $("fTo").onchange = () => updateCalc(true);
  $("fHave").oninput = () => updateCalc(false);
  $("fUse").oninput = () => updateCalc(false);

  $("btnSubmit").onclick = async () => {
    const name = $("fName").value.trim(), email = $("fEmail").value.trim(),
          from = $("fFrom").value, to = $("fTo").value,
          have = parseFloat($("fHave").value), use = parseFloat($("fUse").value),
          reason = $("fReason").value.trim(), deputy = $("fDeputy").value.trim(),
          phone = $("fPhone").value.trim(),
          vtype = $("fType").value, daikyu = $("fDaikyu") ? $("fDaikyu").value.trim() : "",
          prepEl = document.querySelector('input[name="fPrep"]:checked'),
          prep = prepEl ? prepEl.value : "";
    const days = calcDays(from, to);
    const errs = [];
    if (!name) errs.push("休暇者（お名前）");
    if (!from || !to || days === null) errs.push("休暇希望日（正しい期間）");
    if (isNaN(have)) errs.push("現在の保有休暇日数");
    if (isNaN(use)) errs.push("使用日数");
    if (!vtype) errs.push("休暇の種類");
    if (vtype === "代休" && !daikyu) errs.push("代休の対象");
    if (!reason) errs.push("事由");
    if (!prep) errs.push("特別業務への備え（YES / NO）");
    if (!deputy) errs.push("業務代行者");
    if (!phone) errs.push("電話対応者");
    if (errs.length) { $("fMsg").innerHTML = '<p class="msg err">次の必須項目を入力してください：' + esc(errs.join("、")) + '</p>'; return; }
    if (have - use < 0 && !confirm("使用後の保有休暇日数がマイナスになります。このまま提出しますか？")) return;
    if (prep === "NO" && !confirm("特別業務への備えが「NO」のままです。承認時に確認が入る可能性があります。このまま提出しますか？")) return;
    $("btnSubmit").disabled = true; $("btnSubmit").textContent = "送信中...";
    try {
      await mutate(() => {
        requests.push({
          id: uid(), draftDate: todayJP(), name, applicantEmail: email, fromDate: from, toDate: to,
          haveDays: have, useDays: use, afterDays: Math.round((have - use) * 10) / 10,
          status: "pending",
          vacationType: vtype, daikyuDetail: vtype === "代休" ? daikyu : "",
          reason, workOk: $("fWorkOk").checked,
          calOk: $("fWorkCal").checked, kakaoOk: $("fWorkKakao").checked, custOk: $("fWorkCust").checked,
          mailOk: $("fWorkMail").checked,
          specialPrep: prep,
          deputy, phonePerson: phone,
          submittedAt: new Date().toISOString()
        });
      });
      const body = "休暇届が提出されました。\n\n" +
        "■ 休暇者：" + name + "\n" +
        "■ 休暇期間：" + fmtD(from) + " 〜 " + fmtD(to) + "（" + use + "日間）\n" +
        "■ 休暇の種類：" + vtype + (vtype === "代休" ? "（" + daikyu + "）" : "") + "\n" +
        "■ 事由：" + reason + "\n" +
        "■ 業務代行者：" + deputy + "\n" +
        "■ 会社携帯の電話対応：" + phone + "\n\n" +
        "▼ 承認はこちらから\nhttps://korealabo.github.io/kyuka/";
      const sent = await sendMail(APPROVERS, "【休暇届】" + name + "さんより新規提出（" + fmtD(from) + "〜）", body);
      alert(sent ? "✅ 休暇届を提出しました。決裁者へ通知メールを送信しました。" : "✅ 休暇届を提出しました。（通知メールの送信に失敗しましたが、届出は保存されています）");
      view = "list"; render();
    } catch (e) {
      $("fMsg").innerHTML = '<p class="msg err">' + esc(e.message) + '</p>';
      $("btnSubmit").disabled = false; $("btnSubmit").textContent = "休暇届を提出する";
    }
  };
}

/* ===== 描画・更新 ===== */
function render() {
  if (view === "detail") renderDetail();
  else if (view === "form") renderForm();
  else renderList();
  window.scrollTo(0, 0);
}
async function refresh() {
  try { await loadData(); render(); }
  catch (e) {
    $("app").innerHTML = '<div class="empty">⚠️ ' + esc(e.message) + '<br><br><button id="btnRetry">再読み込み</button></div>';
    $("btnRetry").onclick = refresh;
  }
}

/* ===== 起動 ===== */
if (!BIN_ID || BIN_ID === "PASTE_BIN_ID_HERE") {
  renderSetup();
} else {
  refresh();
}
</script>
</body>
</html>
